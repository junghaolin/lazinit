# Lazinit-style Tmux Configuration

# --- 1. Basic Settings ---
set -g mouse on
# 使用 xterm-256color 而非 tmux-256color，確保 SSH 連入嵌入式環境 (如 DUT/minimal OS) 時不因缺乏 terminfo 報錯
set -g default-terminal "xterm-256color"
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",*:Tc"
set -as terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000

# --- 2. Key Bindings ---
set -g prefix C-n
unbind C-b
bind C-n send-prefix

# Split Panes (keep current path)
bind C-o split-window -h -c "#{pane_current_path}"
bind C-e split-window -v -c "#{pane_current_path}"

# Pane switching (Vim style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"

# --- 3. UI & Appearance ---
set-option -g status-position top
set-option -g status-style bg=default,fg=colour245
set-option -g status-left " #[fg=blue,bold]#S #[default]  "
set-option -g status-right " #[fg=white]%H:%M #[default]"
set-option -g status-justify left

set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format "#[bg=blue,fg=white,bold] #I:#W #[default]"

# --- 4. Copy Mode (Vi style) ---
# 啟用 OSC 52 剪貼簿整合，交由終端（如 Ghostty）原生處理；避免在 Wayland 下使用 xsel/xclip 產生卡頓或報錯
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g base-index 1
setw -g pane-base-index 1
