# ==========================
# 基本設定 (Basic Settings)
# ==========================

# 啟用滑鼠支援 (允許點擊切換窗格、拖曳調整大小、以及 Tmux 原生選取)
set -g mouse on

# 讓 Tmux 支援 256 色與 True Color (RGB)，這對 Neovim 的色彩顯示非常重要
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 允許終端機跳脫序列 (Passthrough)，這是讓 image.nvim 在 tmux 中顯示圖片所必需的
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ==========================
# 快捷鍵設定 (Key Bindings)
# ==========================

# 將 Prefix 鍵改為 Ctrl+` (Ctrl + 反引號)
# set -g prefix M-`
# unbind C-b
# bind M-` send-prefix
# set -g prefix C-`
# unbind C-b
# unbind C-a
# bind C-` send-prefix
bind C-b send-prefix

# 分割窗格 (Split Panes)
# 左右分割 (-h)，並保留當前路徑
bind C-o split-window -h -c "#{pane_current_path}"
# 上下分割 (-v)，並保留當前路徑
bind C-e split-window -v -c "#{pane_current_path}"

# 快速切換窗格 (Vim 風格: h, j, k, l)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# 快速重新載入設定檔
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"

# ==========================
# 介面與外觀 (UI & Appearance)
# ==========================

# 將狀態列 (Tabs) 移到上方 (像瀏覽器分頁)
set-option -g status-position top

# 設定狀態列背景與前景顏色 (使用簡潔的灰黑色系，不干擾主畫面)
set-option -g status-style bg=default,fg=colour245

# 左側顯示 Session 名稱 (加粗藍色)
set-option -g status-left " #[fg=blue,bold]#S #[default]  "
set-option -g status-left-length 30

# 右側清空，保持極簡
set-option -g status-right ""

# 設定 Window (Tabs) 列表對齊方式 (靠左對齊)
set-option -g status-justify left

# 未選取的 Tab 樣式
set-window-option -g window-status-format " #I:#W "

# 當前選取的 Tab 樣式 (高亮顯示，讓它看起來像被啟用的按鈕)
set-window-option -g window-status-current-format "#[bg=blue,fg=white,bold] #I:#W #[default]"

# 讓不同 Window 切換時，畫面邊框也能清楚標示
set-option -g pane-active-border-style fg=blue
set-option -g pane-border-style fg=colour238

# ==========================
# 複製模式優化 (Copy Mode)
# ==========================

# 啟用與系統剪貼簿的同步 (OSC 52)
set -s set-clipboard on

# 在複製模式下使用 vi 的按鍵綁定
setw -g mode-keys vi

# 進入複製模式後，按 'v' 開始選取，按 'y' 複製並退出
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i -b || xclip -in -selection clipboard"

# 使用滑鼠拖曳選取後，自動複製到系統剪貼簿並退出選取模式
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i -b || xclip -in -selection clipboard"

set -g base-index 1
setw -g pane-base-index 1
